<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Family Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
  </head>
  <body>
    <div class="photo-stage">
      <div class="photo-slot" id="slot-a">
        <img class="photo-bg" id="bg-a" alt="" aria-hidden="true" />
        <img class="photo-fg" id="fg-a" alt="" />
      </div>
      <div class="photo-slot" id="slot-b">
        <img class="photo-bg" id="bg-b" alt="" aria-hidden="true" />
        <img class="photo-fg" id="fg-b" alt="" />
      </div>
    </div>

    <div class="panel panel-clock">
      <div class="clock-time" id="clock-time"></div>
      <div class="clock-date" id="clock-date"></div>
    </div>

    <div class="panel panel-weather" id="weather"></div>

    <div class="panel panel-calendar" id="calendar"></div>

    <div class="panel panel-sensors" id="sensors"></div>

    <div class="panel panel-electricity" id="electricity"></div>

    <div class="caption" id="caption-a"></div>
    <div class="caption" id="caption-b"></div>

    <div class="fab-row">
    <button class="fab-btn" id="cam-btn" title="Kamerat" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>

    <button class="fab-btn" id="ctrl-btn" title="Ohjaus" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="6" width="22" height="12" rx="6"/>
        <circle cx="16" cy="12" r="3"/>
      </svg>
    </button>

    <button class="fab-btn music-fab" id="music-btn" title="Musiikki" hidden>
      <svg class="music-fab-note" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      <span class="music-fab-eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>

    <button class="fab-btn" id="phone-btn" title="Puhelin" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </button>

    <button class="fab-btn voice-btn" id="voice-btn" title="Puheavustaja" hidden>
      <svg class="voice-mic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>
      </svg>
      <span class="glados-eye" aria-hidden="true"><span class="glados-ring"></span><span class="glados-iris"></span></span>
    </button>

    <button class="fab-btn" id="settings-btn" title="Asetukset" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    </div>

    <button class="music-badge" id="music-badge" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="music-badge-text" id="music-badge-text"></span>
    </button>

    <div class="voice-bubble" id="voice-bubble" hidden>
      <div class="voice-heard" id="voice-heard"></div>
      <div class="voice-answer" id="voice-answer"></div>
    </div>

    <div class="ctrl-overlay" id="ctrl-overlay" hidden>
      <button class="cam-close" id="ctrl-close" aria-label="Sulje">✕</button>
      <div class="ctrl-scroll">
        <div class="ctrl-grid" id="ctrl-grid"></div>
      </div>
    </div>

    <div class="music-overlay" id="music-overlay" hidden>
      <button class="cam-close" id="music-close" aria-label="Sulje">✕</button>
      <section class="mv-now" id="mv-now">
        <div class="mv-art-wrap">
          <img class="mv-art" id="mv-art" alt="" hidden />
        </div>
        <div class="mv-title" id="mv-title"></div>
        <div class="mv-artist" id="mv-artist"></div>
        <div class="mv-progress" id="mv-progress"><div class="mv-progress-fill" id="mv-progress-fill"></div></div>
        <div class="mv-times"><span id="mv-elapsed"></span><span id="mv-duration"></span></div>
        <div class="mv-buttons">
          <button class="music-btn mv-toggle" id="mv-shuffle" aria-label="Sekoita"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
          <button class="music-btn" data-action="previous" aria-label="Edellinen"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button class="music-btn music-pp" data-action="play_pause" aria-label="Toista/tauko">
            <svg class="icon-play" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button class="music-btn" data-action="next" aria-label="Seuraava"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
          <button class="music-btn mv-toggle" id="mv-repeat" aria-label="Toista uudelleen"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span class="mv-repeat-one">1</span></button>
        </div>
        <div class="music-volume">
          <button class="music-btn" data-vol="-1" aria-label="Hiljemmalle">−</button>
          <span class="music-vol" id="music-vol"></span>
          <button class="music-btn" data-vol="1" aria-label="Kovemmalle">+</button>
        </div>
        <div class="mv-next" id="mv-next"></div>
        <div class="mv-speakers" id="mv-speakers"></div>
      </section>
      <section class="mv-browse">
        <div class="mv-tabs" id="mv-tabs">
          <button class="mv-tab" data-group="recent">Viimeksi soitetut</button>
          <button class="mv-tab" data-group="playlist">Soittolistat</button>
          <button class="mv-tab" data-group="album">Albumit</button>
          <button class="mv-tab" data-group="artist">Artistit</button>
        </div>
        <div class="mv-grid" id="mv-grid"></div>
      </section>
    </div>

    <div class="cam-overlay" id="cam-overlay" hidden>
      <button class="cam-close" id="cam-close" aria-label="Sulje">✕</button>
      <div class="cam-grid" id="cam-grid"></div>
    </div>

    <div class="radar-overlay" id="radar-overlay" hidden>
      <div class="radar-map" id="radar-map">
        <div class="radar-tiles" id="radar-tiles"></div>
        <div class="radar-frames" id="radar-frames"></div>
        <div class="radar-home" id="radar-home"></div>
      </div>
      <button class="cam-close radar-close" id="radar-close" aria-label="Sulje">✕</button>
      <div class="radar-bar">
        <button class="radar-play" id="radar-play" aria-label="Toista / pysäytä">❚❚</button>
        <div class="radar-time" id="radar-time"></div>
        <div class="radar-steps" id="radar-steps"></div>
      </div>
      <div class="radar-attrib">Tutka © Ilmatieteen laitos · Kartta © OpenStreetMap-tekijät</div>
    </div>

    <button class="refresh-btn" id="refresh" title="Päivitä">
      <svg class="refresh-ring" viewBox="0 0 56 56" aria-hidden="true">
        <circle class="refresh-ring-track" cx="28" cy="28" r="26"></circle>
        <circle class="refresh-ring-progress" cx="28" cy="28" r="26"></circle>
      </svg>
      <span class="refresh-icon">↻</span>
    </button>

    <div class="phone-overlay" id="phone-overlay" hidden>
      <button class="cam-close" id="phone-close" aria-label="Sulje">✕</button>
      <div class="phone-body">
        <div class="phone-contacts" id="phone-contacts"></div>
        <div class="phone-pad">
          <div class="phone-number" id="phone-number"></div>
          <div class="phone-keys" id="phone-keys"></div>
          <div class="phone-actions">
            <button class="call-btn answer" id="phone-call" aria-label="Soita">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
            <button class="phone-key phone-back" id="phone-back" aria-label="Poista">⌫</button>
          </div>
          <div class="phone-status" id="phone-status"></div>
        </div>
      </div>
    </div>

    <div class="call-overlay" id="call-overlay" hidden>
      <div class="call-name" id="call-name"></div>
      <div class="call-number" id="call-number"></div>
      <div class="call-status" id="call-status"></div>
      <div class="call-buttons">
        <button class="call-btn reject" id="call-reject" aria-label="Hylkää">✕</button>
        <button class="call-btn answer" id="call-answer" aria-label="Vastaa">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="call-btn reject" id="call-end" aria-label="Lopeta puhelu">✕</button>
      </div>
    </div>

    <div class="pw-overlay" id="settings-overlay" hidden>
      <form class="pw-box" id="settings-form">
        <div class="pw-label">Puhelin (Enreach Voice)</div>
        <input class="pw-input settings-input" id="settings-user" type="email" placeholder="Käyttäjätunnus" autocomplete="username" />
        <input class="pw-input settings-input" id="settings-pass" type="password" placeholder="Salasana" autocomplete="current-password" />
        <div class="phone-status" id="settings-status"></div>
        <div class="settings-actions">
          <button class="pw-btn" type="button" id="settings-clear">Poista</button>
          <button class="pw-btn" type="button" id="settings-cancel">Peruuta</button>
          <button class="pw-btn" type="submit">Tallenna</button>
        </div>
      </form>
    </div>

    <div class="pw-overlay" id="pw-overlay" hidden>
      <form class="pw-box" id="pw-form">
        <label class="pw-label" for="pw-input">Salasana</label>
        <input class="pw-input" id="pw-input" type="password" autocomplete="current-password" />
        <button class="pw-btn" type="submit">OK</button>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
